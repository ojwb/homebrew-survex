name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    strategy:
      # Don't cancel other jobs if one fails.
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, xcode-27]
        opts: ['--without-ffmpeg --HEAD']
    runs-on: ${{ matrix.os }}

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Update homebrew
        run: |
          # Remove taps we don't use which spam the logs with warnings, e.g.:
          # Skipping aws/tap because it is not trusted. Run `brew trust aws/tap` to trust it.
          brew untap --force aws/tap azure/bicep || true
          brew update-if-needed
          brew upgrade

      - name: Install extra dependencies for --HEAD
        if: ${{ contains(matrix.opts, '--HEAD') }}
        run: |
          brew uninstall perl
          brew install inkscape
          which inkscape || true
          PATH=/opt/homebrew/bin:$PATH
          which inkscape || true
          inkscape --version
      - name: Test installing survex homebrew package
        run: |
          brew tap survex/survex https://git.survex.com/homebrew-survex
          brew trust --formula survex/survex/survex
          brew install survex ${{ matrix.opts }}
      - name: Run cavern
        run: |
          echo '*fix 1 reference 0 0 0' > test.svx
          cavern test.svx
      - name: Run aven
        run: |
          # Test that aven starts up and is still running after 60 seconds.
          # Regression test for fix in 1.4.23 - macOS 27 has a locale handling
          # bug we needed to workaround.
          sleep 60 ; killall -SIGUSR1 aven &
          rc=0
          env LC_ALL=pl_PL.UTF-8 aven test.3d || rc=$?
          if [ "$rc" -ne 138 ] ; then
            echo "aven exited with status $rc"
            exit 1
          fi
